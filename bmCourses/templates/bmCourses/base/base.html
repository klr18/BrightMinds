<!DOCTYPE html>
<html lang="ru">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link type="text/css" href="{% static 'bmCourses/css/styles.css' %}" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'bmCourses/images/main.png' %}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="wrapper">
    {% include 'bmCourses/base/header.html' %}

    <div class="content" style="padding-top: 82px;">
        <div class="container-fluid">
            <div class="row">
                {% include 'bmCourses/base/sidebar.html' %}

                <main class="col-md-9 col-lg-10 py-5">
                    {% block breadcrumbs %}{% endblock %}
                    <div class="content-text">
                        {% block content %}{% endblock %}
                        {% include 'bmCourses/base/pagination.html' %}
                    </div>
                </main>
            </div>
        </div>
    </div>

    {% include 'bmCourses/base/footer.html' %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
