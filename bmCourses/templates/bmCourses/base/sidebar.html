<aside class="col-md-3 col-lg-2 bg-light sidebar text-center p-4 shadow-sm">
    <ul class="nav flex-column fs-5">
        {% if cat_selected == 0 %}
        <li class="nav-item selected mt-1">
            <span class="nav-link active text-primary border-bottom border-3">Все категории</span>
        </li>
        {% else %}
        <li class="nav-item mt-1">
            <a class="nav-link text-dark" href="{% url 'home' %}">Все категории</a>
        </li>
        {% endif %}

        {% for c in cats %}
        {% if c.id == cat_selected %}
        <li class="nav-item selected mt-1">
            <span class="nav-link active text-primary border-bottom border-3">{{ c.name }}</span>
        </li>
        {% else %}
        <li class="nav-item mt-1">
            <a class="nav-link text-dark" href="{{ c.get_absolute_url }}">{{ c.name }}</a>
        </li>
        {% endif %}
        {% endfor %}
    </ul>
</aside>
